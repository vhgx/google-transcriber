[package]
name = "yt-txt"
version = "0.1.0"
description = "Transcrições locais de vídeos do Google Drive"
authors = ["Vitor"]
edition = "2021"

[lib]
name = "yt_txt_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["process", "sync", "time", "io-util", "fs", "rt-multi-thread"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
